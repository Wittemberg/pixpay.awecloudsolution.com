name: Test, publish and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixpay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Swarm stack configuration
        run: docker stack config -c deploy/stack.yml >/dev/null

      - name: Validate OpenSpec change artifacts
        run: npx --yes @fission-ai/openspec@1.13.1 validate --all --strict
        env:
          OPENSPEC_TELEMETRY: '0'

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish image to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          REVISION: ${{ github.sha }}
          IMAGE: ghcr.io/wittemberg/pixpay.awecloudsolution.com
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          docker build --build-arg REVISION="$REVISION" -t "$IMAGE:sha-$REVISION" -t "$IMAGE:main" .
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:main"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Trigger Portainer Webhook and Verify Health
        env:
          PORTAINER_STACK_WEBHOOK: ${{ secrets.PORTAINER_STACK_WEBHOOK }}
          EXPECTED_REVISION: ${{ github.sha }}
          HEALTH_URL: https://pixpay.awecloudsolution.com/api/health
        run: python3 scripts/deploy.py
